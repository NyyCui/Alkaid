<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航标 · 请求台</title><link rel="stylesheet" href="network.css"></head>
<body><aside><a class="brand" href="#"><span class="mark">↗</span><strong>航标<small>REQUEST STUDIO</small></strong></a><p class="intro">每一次请求，<br>都有清晰的去向。</p><div class="scope"><span class="label">已授权的服务</span><select id="endpoint" aria-label="网络端点" disabled></select><p id="destination">正在读取端点…</p><span id="boundary" class="tag">连接瑶光台中</span></div><div class="aside-bottom"><span class="dot"></span><span>瑶光台 · 网络能力示例</span><p>请求由瑶光台发送。<br>这里只呈现你的操作与结果。</p></div></aside>
<main><header><div><span class="label">01 / COMPOSE</span><h1>发出请求</h1></div><span id="runtime" class="runtime">等待连接</span></header>
<section class="compose" aria-label="请求编辑"><div class="request-line"><select id="method" aria-label="请求方法" disabled></select><input id="path" aria-label="端点内路径" value="/get" spellcheck="false"><button id="send" disabled>发送请求 <span>↗</span></button><button id="cancel" hidden>取消</button></div><p class="path-note">路径相对于上方已授权的服务地址。</p><label id="body-label" for="body" hidden>请求正文 · JSON</label><textarea id="body" spellcheck="false" hidden>{"message":"你好，瑶光台"}</textarea><div class="presets"><span>试一试</span><button data-path="/get" data-method="GET">读取 JSON</button><button data-path="/post" data-method="POST">回显正文</button><button data-path="/status/404" data-method="GET">404 响应</button><button data-path="/bytes/1048576" data-method="GET">二进制响应</button></div></section>
<section class="response" aria-label="网络响应"><div class="response-heading"><div><span class="label">02 / RESPONSE</span><h2>查看返回</h2></div><span id="status" class="status">尚未发送</span></div><div class="summary"><span id="size">— 字节</span><span id="duration">— 毫秒</span><span id="progress" role="status">准备好后，发送你的第一条请求。</span></div><div id="error" class="error" role="alert" hidden></div><nav class="tabs" aria-label="响应视图"><button id="tab-body" aria-pressed="true">正文</button><button id="tab-headers" aria-pressed="false">响应头</button><button id="clear">清空结果</button></nav><pre id="output" tabindex="0">响应会显示在这里。

HTTP 错误状态会保留原始返回，
网络连接失败会单独提示。</pre></section><footer>PUBLIC ENDPOINTS · EXPLICIT PERMISSION <span>航标 / 1.0</span></footer></main><script type="module" src="src/main.js"></script></body></html>
