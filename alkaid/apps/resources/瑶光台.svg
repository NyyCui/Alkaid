    <!-- 1. 背景与氛围 -->
    <!-- 2. 外圈装饰框 (天圆地方) -->
    <!-- 3. 星璇天穹 (不完整星轨) -->
    <!-- 4. 瑶光七星阵 (核心意象) -->
    <!-- 连接线 -->
    <!-- 辅星 (其余六星) -->
    <!-- 主星 · 瑶光 (勺柄末端，最亮) -->
    <!-- 瑶光星芒装饰 -->
    <!-- 5. 承影之台 (平台基座) -->
