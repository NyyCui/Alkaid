                    offset="0%"
                    stop-color="#F2C94C"
                    id="stop1"/>
            <stop
                    offset="40%"
                    stop-color="#F2C94C"
                    stop-opacity="0.8"
                    id="stop2"/>
            <stop
                    offset="100%"
                    stop-color="#F2C94C"
                    stop-opacity="0"
                    id="stop3"/>
        </radialGradient>
        <!-- 科技青渐变 -->
        <linearGradient
                id="lineGradient"
                x1="48.786737"
                x2="234.03493"
                y1="55.186098"
                y2="240.43429"
